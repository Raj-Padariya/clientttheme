<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Portal Themes · Demo FX</title>
  <style>
    :root {
      --bg: #0a0c0f;
      --panel: #12151a;
      --line: rgba(255, 255, 255, .08);
      --fg: #eef0f3;
      --muted: #9aa2ad;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
    }

    /* Dot grid + soft spotlight that follows the cursor */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 100%);
    }
    .spotlight {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(600px circle at var(--mx, 50%) var(--my, -20%), rgba(255, 255, 255, .06), transparent 60%);
    }

    main { max-width: 1240px; margin: 0 auto; padding: 72px 24px 96px; }

    header { text-align: center; margin-bottom: 64px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .03);
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .02em;
    }
    .pulse {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }
    .pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #4ade80;
      animation: ping 1.8s var(--ease) infinite;
    }
    @keyframes ping { to { transform: scale(3); opacity: 0; } }
    h1 {
      margin: 20px 0 14px;
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -.03em;
      font-weight: 700;
    }
    h1 .grad {
      background: linear-gradient(90deg, #d4af37, #8b5cf6, #2dd4bf, #e5484d, #9fc4ae, #d4af37);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: slide 8s linear infinite;
    }
    @keyframes slide { to { background-position: 200% 0; } }
    .lead { margin: 0 auto; max-width: 560px; font-size: 17px; line-height: 1.6; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    .grid .card:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .grid .card:last-child:nth-child(odd) .stage { aspect-ratio: 21 / 9; }

    .card {
      --accent: #fff;
      position: relative;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03) 40%, rgba(255, 255, 255, .03));
      transform: perspective(1200px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0));
      transition: transform .5s var(--ease), box-shadow .5s var(--ease);
      opacity: 0;
      animation: rise .8s var(--ease) forwards;
      animation-delay: calc(var(--i) * 110ms);
    }
    @keyframes rise { from { opacity: 0; translate: 0 28px; } to { opacity: 1; translate: 0 0; } }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from var(--angle, 0deg), transparent 0 70%, var(--accent) 85%, transparent 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity .4s;
      /* Paused while invisible: an @property animation repaints every frame even at opacity 0. */
      animation: spin 4s linear infinite paused;
    }
    @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    @keyframes spin { to { --angle: 360deg; } }
    .card:hover, .card:focus-within { --lift: -6px; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9); }
    .card:hover::before, .card:focus-within::before { opacity: 1; animation-play-state: running; }

    .inner {
      position: relative;
      height: 100%;
      border-radius: 23px;
      background: var(--panel);
      overflow: hidden;
    }

    /* Mockup stage */
    .stage {
      position: relative;
      aspect-ratio: 16 / 10;
      padding: 28px 28px 0;
      overflow: hidden;
      background:
        radial-gradient(70% 80% at 50% 110%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
        linear-gradient(180deg, rgba(255, 255, 255, .02), transparent);
      border-bottom: 1px solid var(--line);
    }
    .browser {
      position: relative;
      height: 100%;
      border-radius: 12px 12px 0 0;
      border: 1px solid rgba(255, 255, 255, .1);
      border-bottom: 0;
      background: #0d0f12;
      overflow: hidden;
      transform: translateY(14px);
      transition: transform .6s var(--ease);
      box-shadow: 0 -10px 40px -20px color-mix(in srgb, var(--accent) 50%, transparent);
    }
    .card:hover .browser { transform: translateY(0); }
    .chrome {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 30px;
      padding: 0 12px;
      background: #16191e;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: #3a3f47; }
    .card:hover .dots i:nth-child(1) { background: #ff5f57; }
    .card:hover .dots i:nth-child(2) { background: #febc2e; }
    .card:hover .dots i:nth-child(3) { background: #28c840; }
    .address {
      flex: 1;
      max-width: 260px;
      margin: 0 auto;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .05);
      font: 12px/1.4 ui-monospace, Consolas, monospace;
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .screen { position: relative; height: calc(100% - 30px); overflow: hidden; }
    .screen iframe, .phone-screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
      transform-origin: 0 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .6s;
    }
    .screen iframe.ready, .phone-screen iframe.ready { opacity: 1; }
    .skeleton { position: absolute; inset: 0; overflow: hidden; background: #0f1216; }
    /* Transform-only shimmer so waiting previews stay on the compositor instead of repainting. */
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .05) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: shimmer 1.4s linear infinite;
    }
    @keyframes shimmer { to { transform: translateX(100%); } }

    /* Glass sheen that sweeps on hover */
    .sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .09) 50%, transparent 65%);
      transform: translateX(-100%);
    }
    .card:hover .sheen { transition: transform 1.1s var(--ease); transform: translateX(100%); }

    .phone {
      position: absolute;
      right: 22px;
      bottom: -18px;
      width: 104px;
      aspect-ratio: 390 / 844;
      padding: 5px;
      border-radius: 20px;
      background: #1b1e23;
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .9);
      transform: translateY(18px) rotate(4deg);
      transition: transform .7s var(--ease);
    }
    .card:hover .phone { transform: translateY(-4px) rotate(0deg); }
    .phone-screen { position: relative; width: 100%; height: 100%; border-radius: 15px; overflow: hidden; background: #0f1216; }
    .phone-screen::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 50%;
      z-index: 2;
      width: 30%;
      height: 7px;
      border-radius: 6px;
      background: #000;
      transform: translateX(-50%);
    }

    /* Card footer */
    .meta { display: flex; align-items: center; gap: 18px; padding: 22px 24px 24px; }
    .info { flex: 1; min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .name { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, .05);
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #6b7280; }
    .status.live { color: #86efac; }
    .status.live::before { background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, .18); }
    .status.down { color: #fca5a5; }
    .status.down::before { background: #f87171; }
    .desc { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
    .palette { display: flex; gap: 6px; margin-top: 12px; }
    .palette span {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, .12);
      transition: transform .3s var(--ease);
    }
    .card:hover .palette span { transform: translateY(-3px); }
    .card:hover .palette span:nth-child(2) { transition-delay: 50ms; }
    .card:hover .palette span:nth-child(3) { transition-delay: 100ms; }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent, #0a0c0f);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .3s var(--ease), filter .3s;
    }
    .cta svg { transition: transform .3s var(--ease); }
    .card:hover .cta svg { transform: translateX(4px); }
    .cta:hover { filter: brightness(1.08); }
    .cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    /* Whole card is clickable through the CTA's stretched hit area */
    .cta::after { content: ""; position: absolute; inset: 0; border-radius: 24px; }

    footer { margin-top: 56px; text-align: center; font-size: 13px; color: var(--muted); }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .grid .card:last-child:nth-child(odd) .stage { aspect-ratio: 16 / 10; }
    }
    @media (max-width: 520px) {
      main { padding-top: 48px; }
      .stage { padding: 16px 16px 0; }
      .phone { width: 76px; right: 12px; border-radius: 15px; }
      .phone-screen { border-radius: 11px; }
      .meta { flex-direction: column; align-items: stretch; }
      .cta { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .card { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="spotlight" aria-hidden="true"></div>

  <main>
    <header>
      <span class="eyebrow"><span class="pulse" aria-hidden="true"></span>Demo FX · Client Portal</span>
      <h1>Ek portal, <span class="grad">paanch themes</span></h1>
      <p class="lead">Har theme ka live preview neeche hai. Jis theme par click karoge, wo nayi tab mein khul jayegi.</p>
    </header>

    <div class="grid" id="grid"></div>

    <footer>Live preview har theme ke local server se aata hai.</footer>
  </main>

  <script>
    const themes = [
      { name: 'Theme One', desc: 'Dark + gold', port: 3100, accent: '#d4af37', onAccent: '#14110a', palette: ['#070d16', '#d4af37', '#f5e6b3'] },
      { name: 'Orbit', desc: 'Violet', port: 3200, accent: '#8b5cf6', onAccent: '#ffffff', palette: ['#1a1530', '#8b5cf6', '#c4b5fd'] },
      { name: 'Nova', desc: 'Teal', port: 3300, accent: '#2dd4bf', onAccent: '#062520', palette: ['#0b1f1e', '#2dd4bf', '#99f6e4'] },
      { name: 'Zenith', desc: 'Red', port: 3400, accent: '#e5484d', onAccent: '#ffffff', palette: ['#161616', '#e5484d', '#fbcfd0'] },
      { name: 'Aurora', desc: 'Sage + clay', port: 3600, accent: '#9fc4ae', onAccent: '#13201a', palette: ['#12171a', '#9fc4ae', '#e0a890'] },
    ];

    const DESKTOP = { w: 1440, h: 900 };
    const MOBILE = { w: 390, h: 844 };
    const grid = document.getElementById('grid');

    themes.forEach((theme, i) => {
      const url = `http://localhost:${theme.port}`;
      const card = document.createElement('article');
      card.className = 'card';
      card.style.setProperty('--i', i);
      card.style.setProperty('--accent', theme.accent);
      card.style.setProperty('--on-accent', theme.onAccent);
      card.innerHTML = `
        <div class="inner">
          <div class="stage" aria-hidden="true">
            <div class="browser">
              <div class="chrome">
                <div class="dots"><i></i><i></i><i></i></div>
                <div class="address">localhost:${theme.port}/dashboard</div>
              </div>
              <div class="screen" data-w="${DESKTOP.w}" data-h="${DESKTOP.h}">
                <div class="skeleton"></div>
                <iframe data-src="${url}/dashboard" width="${DESKTOP.w}" height="${DESKTOP.h}" tabindex="-1" title=""></iframe>
              </div>
              <div class="sheen"></div>
            </div>
            <div class="phone">
              <div class="phone-screen" data-w="${MOBILE.w}" data-h="${MOBILE.h}">
                <div class="skeleton"></div>
                <iframe data-src="${url}/dashboard" width="${MOBILE.w}" height="${MOBILE.h}" tabindex="-1" title=""></iframe>
              </div>
            </div>
          </div>
          <div class="meta">
            <div class="info">
              <div class="title-row">
                <h2 class="name">${theme.name}</h2>
                <span class="status" data-port="${theme.port}">Checking…</span>
              </div>
              <p class="desc">${theme.desc} · localhost:${theme.port}</p>
              <div class="palette" aria-hidden="true">${theme.palette.map((c) => `<span style="background:${c}"></span>`).join('')}</div>
            </div>
            <a class="cta" href="${url}" target="_blank" rel="noopener" aria-label="Open ${theme.name} theme">
              Open theme
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
          </div>
        </div>`;
      grid.appendChild(card);
    });

    // Scale each fixed-size iframe to fill its mockup screen.
    const fitScreen = (screen) => {
      const frame = screen.querySelector('iframe');
      const scale = screen.clientWidth / Number(screen.dataset.w);
      frame.style.transform = `scale(${scale})`;
    };
    const resizer = new ResizeObserver((entries) => entries.forEach((entry) => fitScreen(entry.target)));

    // Each preview is a full portal app, so booting all ten at once froze the page. Previews load only when
    // their card is near the viewport, one at a time (desktop screens before phones), and the next starts when
    // the previous one has loaded or after a timeout if a server is slow or down.
    const LOAD_TIMEOUT_MS = 6000;
    const queue = [];
    let loading = null;

    const loadNext = () => {
      if (loading || queue.length === 0) return;
      queue.sort((a, b) => Number(a.classList.contains('phone-screen')) - Number(b.classList.contains('phone-screen')));
      const screen = queue.shift();
      const frame = screen.querySelector('iframe');
      loading = screen;
      const finish = () => {
        if (loading !== screen) return;
        loading = null;
        loadNext();
      };
      frame.addEventListener('load', () => {
        frame.classList.add('ready');
        screen.querySelector('.skeleton')?.remove();
        finish();
      }, { once: true });
      setTimeout(finish, LOAD_TIMEOUT_MS);
      frame.src = frame.dataset.src;
    };

    const nearViewport = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        nearViewport.unobserve(entry.target);
        queue.push(entry.target);
      });
      loadNext();
    }, { rootMargin: '200px 0px' });

    document.querySelectorAll('.screen, .phone-screen').forEach((screen) => {
      fitScreen(screen);
      resizer.observe(screen);
      nearViewport.observe(screen);
    });

    // Live / offline badge per server (opaque no-cors response still proves it is up).
    document.querySelectorAll('.status').forEach((badge) => {
      fetch(`http://localhost:${badge.dataset.port}`, { mode: 'no-cors', cache: 'no-store' })
        .then(() => { badge.textContent = 'Live'; badge.classList.add('live'); })
        .catch(() => { badge.textContent = 'Offline'; badge.classList.add('down'); });
    });

    // Cursor spotlight + gentle 3D tilt on the hovered card, at most once per frame. The spotlight vars live on
    // the spotlight element only, so a mouse move no longer restyles the whole document.
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const spotlight = document.querySelector('.spotlight');
    let pointer = null;
    let tiltCard = null;
    let frameQueued = false;

    const paintPointer = () => {
      frameQueued = false;
      spotlight.style.setProperty('--mx', `${pointer.clientX}px`);
      spotlight.style.setProperty('--my', `${pointer.clientY}px`);
      if (!tiltCard) return;
      const rect = tiltCard.getBoundingClientRect();
      const x = (pointer.clientX - rect.left) / rect.width - 0.5;
      const y = (pointer.clientY - rect.top) / rect.height - 0.5;
      tiltCard.style.setProperty('--ry', `${x * 6}deg`);
      tiltCard.style.setProperty('--rx', `${-y * 6}deg`);
    };

    window.addEventListener('pointermove', (event) => {
      pointer = { clientX: event.clientX, clientY: event.clientY };
      if (frameQueued) return;
      frameQueued = true;
      requestAnimationFrame(paintPointer);
    }, { passive: true });

    if (!reduceMotion) {
      document.querySelectorAll('.card').forEach((card) => {
        card.addEventListener('pointerenter', () => { tiltCard = card; });
        card.addEventListener('pointerleave', () => {
          if (tiltCard === card) tiltCard = null;
          card.style.setProperty('--rx', '0deg');
          card.style.setProperty('--ry', '0deg');
        });
      });
    }
  </script>
</body>
</html>
